version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: npm
      directory: /apps/windows
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: npm
      directory: /apps/android
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: cargo
      directory: /apps/windows/src-tauri
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: gradle
      directory: /apps/android/native
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5