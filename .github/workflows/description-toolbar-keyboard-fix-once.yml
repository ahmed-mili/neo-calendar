name: Verify description toolbar keyboard fix

on:
  push:
    branches:
      - fix/description-toolbar-keyboard

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/description-toolbar-keyboard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore the lockfile style used by main
        run: |
          git checkout origin/main -- package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting of changed sources
        run: npx prettier --check src/ui/calendar/DescriptionSection.tsx src/ui/calendar/EventPanelRows.tsx src/ui/calendar/DescriptionToolbarEditing.test.tsx package.json

      - name: Run test suite
        run: npm test

      - name: Commit normalized lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Keep root lockfile focused on toolbar regression test"
          git push origin HEAD:fix/description-toolbar-keyboard
