name: Version bump 1.53.5

on:
    push:
        branches:
            - "chore/version-1.53.5"

permissions:
    contents: write

jobs:
    bump:
        name: Synchroniser la version 1.53.5
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"

            - name: Synchroniser tous les fichiers de version
              run: node scripts/set-version.mjs 1.53.5

            - name: Retirer le workflow temporaire et publier le bump
              shell: bash
              run: |
                  rm .github/workflows/version-bump-1.53.5.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Version 1.53.5"
                  git push origin HEAD:chore/version-1.53.5
