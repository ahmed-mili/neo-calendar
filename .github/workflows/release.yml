# Fabrique les deux paquets que l'on installe — l'APK Android et
# l'installateur Windows — et les publie sur la page Releases du dépôt.
#
# Deux façons de publier une version, au choix : pousser l'étiquette `v1.0.3`,
# ou pousser une branche `release/v1.0.3` (l'étiquette est alors posée par la
# release elle-même, ce qui dépanne quand on ne peut pousser que des branches).
# Le déclenchement manuel, lui, construit sans publier : de quoi vérifier que la
# chaîne tient toujours.
#
# Une release stable reconstruit les deux applications. Les updaters consultent
# la dernière release ; elle doit donc toujours contenir l'APK, l'installateur,
# sa signature et les deux fichiers de métadonnées de la même version.
name: Release

on:
    push:
        tags:
            - "v*"
        branches:
            - "release/v*"
    workflow_dispatch:

permissions:
    contents: read

# Repousser un correctif sur la même version annule le build précédent plutôt
# que de laisser deux compilations Rust de douze minutes se courir après.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Ce que cette version a vraiment changé. Presque toutes ne bougent qu'une
    # des deux applications : reconstruire l'installateur Windows pour un
    # correctif Android coûte douze minutes de Rust et publie un fichier
    # identique au précédent, ce qui ne dit rien à qui le télécharge.
    #
    # Le partage n'est pas celui que suggèrent les dossiers : `apps/windows/src`
    # nourrit LES DEUX applications, la coque Android affichant les écrans du
    # bureau. `scripts/releaseScope.mjs` porte la règle, et ses tests avec.
    scope:
        name: Plateformes touchées
        runs-on: ubuntu-latest
        outputs:
            android: ${{ steps.decide.outputs.android }}
            windows: ${{ steps.decide.outputs.windows }}
        steps:
            # Tout l'historique : la comparaison remonte à l'étiquette
            # précédente, que le clone superficiel par défaut n'aurait pas.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Comparer à la version précédente
              id: decide
              run: |
                  # Un déclenchement manuel sert à vérifier que la chaîne tient
                  # encore : il construit donc tout, sans rien trier.
                  if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                    echo "Déclenchement manuel : on construit tout."
                    printf 'android=true\nwindows=true\n' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  previous=$(git tag --list 'v*' --sort=-v:refname \
                    --merged "$GITHUB_SHA" | grep -v "^${GITHUB_REF_NAME#release/}$" | head -1)

                  if [ -z "$previous" ]; then
                    echo "Aucune version précédente : on construit tout."
                    printf 'android=true\nwindows=true\n' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "Depuis $previous :"
                  git diff --name-only "$previous" "$GITHUB_SHA" | tee changed.txt

                  node scripts/releaseScope.mjs < changed.txt >> "$GITHUB_OUTPUT"

                  {
                    echo "### Depuis $previous"
                    echo
                    grep -q '^android=true$' "$GITHUB_OUTPUT" \
                      && echo "- Android : code touché" \
                      || echo "- Android : aucun changement propre"
                    grep -q '^windows=true$' "$GITHUB_OUTPUT" \
                      && echo "- Windows : code touché" \
                      || echo "- Windows : aucun changement propre"
                  } >> "$GITHUB_STEP_SUMMARY"

    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "20"
                  cache: npm

            - run: npm install --no-audit --no-fund
            - run: npm test

    android:
        name: APK Android
        needs: [scope, tests]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json

            # Le module Android compile en Java 17 (`compileOptions` de
            # app/build.gradle.kts).
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Réutiliser le cache Gradle
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  # Même raison que côté Rust : le module Gradle porte le
                  # versionCode, qui monte à chaque release.
                  key: gradle-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: gradle-${{ runner.os }}-

            # L'application Android partage les écrans de `apps/windows`, que le
            # typage traverse jusqu'à leurs imports `@tauri-apps` : ses
            # dépendances doivent être là même si aucune ne part dans l'APK.
            - name: Installer les dépendances
              run: |
                  npm install --no-audit --no-fund
                  npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
                  npm --prefix apps/android install --ignore-scripts --no-audit --no-fund

            - name: Construire le front et le copier dans les assets
              run: |
                  npm --prefix apps/android run build
                  npm --prefix apps/android run android:sync

            # Le runner expose son SDK par ANDROID_HOME, dont Gradle se contente
            # en l'absence de local.properties. Reste à garantir la plateforme
            # que compile le module.
            - name: Assurer la plateforme Android 35
              run: |
                  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

            - name: Restaurer la clé de signature Android
              shell: bash
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/neo-calendar-signing"
                  printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neo-calendar-signing/android.jks"
                  chmod 600 "$RUNNER_TEMP/neo-calendar-signing/android.jks"

            - name: Assembler l'APK signé
              working-directory: apps/android/native
              env:
                  ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/neo-calendar-signing/android.jks
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew --no-daemon assembleRelease

            # Le nom porte la version : un fichier téléchargé dit ce qu'il
            # installe, au lieu d'un « app-release » qui ne dit rien.
            - name: Nommer l'APK
              run: |
                  version=$(node -p "require('./apps/android/package.json').version")
                  # Vide, sauf pour une version de diagnostic — voir
                  # scripts/releaseChannel.mjs. Le nom du fichier est la
                  # dernière chose que l'on voit avant d'installer.
                  suffix=$(node scripts/releaseChannel.mjs)
                  mkdir -p artifacts
                  cp apps/android/native/app/build/outputs/apk/release/app-release.apk \
                     "artifacts/neo-calendar-android-$version$suffix.apk"

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: android
                  path: artifacts/*.apk
                  if-no-files-found: error

    windows:
        name: Installateur Windows
        needs: [scope, tests]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json

            # Sans ce cache, chaque release recompile toute la chaîne Rust de
            # Tauri : douze minutes à chaque fois, pour des dépendances qui n'ont
            # pas bougé.
            #
            # La clé ne dérive pas du Cargo.lock : celui-ci porte le numéro de
            # version du paquet, que chaque release fait monter. La clé changeait
            # donc à tous les coups et le cache n'était jamais retrouvé. Une clé
            # neuve à chaque exécution, rattrapée par le préfixe, garde au
            # contraire l'entrée la plus récente — c'est ce dernier qui travaille.
            - name: Réutiliser le cache Rust
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      apps/windows/src-tauri/target
                  key: cargo-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: cargo-${{ runner.os }}-

            # Les deux applications typent les écrans partagés de `src/`, dont
            # les imports — obsidian, luxon, react — se résolvent depuis la
            # racine. Installer la seule `apps/windows` laisse tsc sans eux.
            - name: Installer les dépendances
              run: |
                  npm install --no-audit --no-fund
                  npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund

            - name: Préparer la configuration updater
              run: node scripts/configure-tauri-updater.mjs
            # `package` compile le front, puis Tauri, puis rend à l'installateur
            # le nom que porte un installateur de bureau.
            - name: Construire et signer l'installateur
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: npm --prefix apps/windows run package

            - name: Rassembler l'installateur
              shell: bash
              run: |
                  mkdir -p artifacts
                  cp apps/windows/src-tauri/target/release/bundle/nsis/*Setup*.exe artifacts/
                  cp apps/windows/src-tauri/target/release/bundle/nsis/*Setup*.exe.sig artifacts/
                  # Même marque que sur l'APK, pour la même raison.
                  suffix=$(node scripts/releaseChannel.mjs)
                  if [ -n "$suffix" ]; then
                    for installer in artifacts/*Setup*.exe; do
                      mv "$installer" "${installer%.exe}$suffix.exe"
                    done
                  fi

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: windows
                  path: |
                      artifacts/*.exe
                      artifacts/*.exe.sig
                  if-no-files-found: error

    publish:
        name: Publier la release
        needs: [scope, android, windows]
        # `always()` permet d'évaluer explicitement les échecs/annulations des
        # jobs requis avant de décider si la release peut être publiée.
        if: >-
            always() && !failure() && !cancelled() &&
            (startsWith(github.ref, 'refs/tags/v') ||
            startsWith(github.ref, 'refs/heads/release/v'))
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: artifacts

            - name: Générer les métadonnées de mise à jour
              shell: bash
              run: |
                  suffix=$(node scripts/releaseChannel.mjs)
                  tag="${GITHUB_REF_NAME#release/}$suffix"
                  android=(artifacts/android/*.apk)
                  windows=(artifacts/windows/*.exe)
                  signatures=(artifacts/windows/*.exe.sig)
                  test ${#android[@]} -eq 1
                  test ${#windows[@]} -eq 1
                  test ${#signatures[@]} -eq 1
                  node scripts/generate-update-metadata.mjs \
                    "${android[0]}" "${windows[0]}" "${signatures[0]}" \
                    artifacts "$tag"

            # `release/v1.0.3` comme `v1.0.3` donnent la même étiquette ; posée
            # sur le commit construit si elle n'existe pas déjà.
            #
            # Une release déjà publiée reçoit les nouveaux paquets au lieu de
            # faire échouer le travail : reconstruire une version — parce qu'un
            # job avait lâché, ou qu'un correctif est reparti sur la même branche
            # — doit aboutir, pas s'arrêter sur « existe déjà ».
            - name: Créer ou compléter la release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Une version compilée avec ses diagnostics allumés n'est pas
                  # une version que l'on installe : elle porte le mot dans son
                  # étiquette et le drapeau pre-release de GitHub, qui la sort
                  # du « Latest ». C'est l'application qui le dit, pas le nom de
                  # la branche : un nom, on oublie de le donner.
                  suffix=$(node scripts/releaseChannel.mjs)
                  tag="${GITHUB_REF_NAME#release/}$suffix"

                  # Seuls les paquets effectivement construits. `nullglob` pour
                  # que le motif d'une application ignorée disparaisse au lieu
                  # de se retrouver dans la liste tel quel.
                  shopt -s nullglob
                  packages=(artifacts/android/*.apk artifacts/windows/*.exe artifacts/windows/*.exe.sig artifacts/latest-android.json artifacts/latest.json)
                  shopt -u nullglob

                  if [ ${#packages[@]} -eq 0 ]; then
                    echo "Aucune application n'a changé : rien à publier."
                    exit 0
                  fi

                  if gh release view "$tag" > /dev/null 2>&1; then
                    echo "Release $tag déjà publiée : mise à jour des paquets."
                    gh release upload "$tag" "${packages[@]}" --clobber
                  else
                    # `--prerelease` pour un diagnostic, et pour lui seul : une
                    # version ordinaire publiée ici est une version qu'on
                    # installe, il n'y a pas de canal d'essai. Le titre
                    # définitif est posé à l'étape suivante, une fois que l'on
                    # sait ce que la release porte.
                    # En `if`, pas en `&&` : la coquille s'arrête au premier
                    # échec, et un `&&` dont la condition est fausse EST un
                    # échec — la publication d'une version ordinaire serait
                    # morte là, sur la ligne qui dit qu'elle est ordinaire.
                    channel=()
                    if [ -n "$suffix" ]; then channel=(--prerelease); fi
                    gh release create "$tag" "${packages[@]}" \
                      --target "$GITHUB_SHA" \
                      --title "$tag" \
                      --generate-notes \
                      "${channel[@]}"
                  fi

            # Le nom d'une release est son numéro, et rien d'autre — sauf
            # quand elle ne porte qu'une des deux applications, auquel cas elle
            # le dit. La règle vit dans `scripts/releaseTitle.mjs`, avec ses
            # tests : le workflow de maintenance s'en sert aussi, et deux
            # copies en bash auraient fini par diverger.
            #
            # Le titre se lit sur les paquets que la release porte VRAIMENT,
            # pas sur ceux que cette exécution vient de construire : relancer
            # le seul travail Windows sur une release qui a déjà son APK ne
            # doit pas la rebaptiser « windows ».
            - name: Nommer la release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="${GITHUB_REF_NAME#release/}$(node scripts/releaseChannel.mjs)"
                  gh release view "$tag" > /dev/null 2>&1 || exit 0

                  title=$(gh release view "$tag" --json assets \
                    --jq '.assets[].name' | node scripts/releaseTitle.mjs "$tag")

                  echo "Titre : $title"
                  gh release edit "$tag" --title "$title"
