name: Fix release test workspace dependencies

on:
  push:
    branches:
      - "fix/release-test-workspace-deps"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/release-test-workspace-deps
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Prove the regression test catches the current release failure
        shell: bash
        run: |
          set -euo pipefail
          if node --test scripts/release-workflow.test.mjs; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
          echo "Regression reproduced: release tests omit workspace dependencies."

      - name: Fix release test dependency installation
        shell: bash
        env:
          OLD_B64: ""
          NEW_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one release tests block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Regression test passes after the fix
        run: node --test scripts/release-workflow.test.mjs

      - name: Reproduce the release Tests job after the fix
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
          npm --prefix apps/android install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit the complete fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-release-test-workspace-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix release test workspace dependencies"
          git push origin HEAD:fix/release-test-workspace-deps
