name: Fix release test workspace dependencies

on:
  push:
    branches:
      - "fix/release-test-workspace-deps"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/release-test-workspace-deps
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Add regression test
        shell: bash
        run: |
          cat > scripts/release-workflow.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const workflow = await readFile(
              new URL("../.github/workflows/release.yml", import.meta.url),
              "utf8"
          );
          const start = workflow.indexOf("\n    tests:\n");
          const end = workflow.indexOf("\n    android:\n", start);
          assert.notEqual(start, -1, "release workflow must have a tests job");
          assert.notEqual(end, -1, "release workflow tests job must precede android");
          const testsJob = workflow.slice(start, end);

          test("release tests install every workspace used by npm test", () => {
              const testCommand = testsJob.indexOf("- run: npm test");
              assert.ok(testCommand >= 0, "release tests job must run npm test");
              for (const command of [
                  "npm install --no-audit --no-fund",
                  "npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund",
                  "npm --prefix apps/android install --ignore-scripts --no-audit --no-fund",
              ]) {
                  const install = testsJob.indexOf(command);
                  assert.ok(
                      install >= 0 && install < testCommand,
                      `${command} must run before npm test`
                  );
              }
          });
          EOF

      - name: Prove the regression test catches the current release failure
        shell: bash
        run: |
          set -euo pipefail
          if node --test scripts/release-workflow.test.mjs; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
          echo "Regression reproduced: release tests omit workspace dependencies."

      - name: Fix release test dependency installation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          old = '''            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm

            - run: npm install --no-audit --no-fund
            - run: npm test
'''
          new = '''            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json

            # `npm test` lance aussi les tests de packaging Windows. Le test de
            # build glass charge Vite pour les deux fronts ; leurs dépendances
            # doivent donc être installées comme dans la validation des PR.
            - name: Installer les dépendances
              run: |
                  npm install --no-audit --no-fund
                  npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
                  npm --prefix apps/android install --ignore-scripts --no-audit --no-fund

            - run: npm test
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one release tests block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Regression test passes after the fix
        run: node --test scripts/release-workflow.test.mjs

      - name: Reproduce the release Tests job after the fix
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
          npm --prefix apps/android install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit the complete fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-release-test-workspace-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml scripts/release-workflow.test.mjs .github/workflows/fix-release-test-workspace-deps.yml
          git commit -m "Fix release test workspace dependencies"
          git push origin HEAD:fix/release-test-workspace-deps
