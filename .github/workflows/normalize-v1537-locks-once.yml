name: Normalize v1.53.7 lockfiles once

on:
  push:
    branches:
      - fix/v1.53.7-draft-description-ics

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.53.7-draft-description-ics
          fetch-depth: 0
      - name: Restore lockfiles then change only their app versions
        run: |
          git checkout origin/main -- package-lock.json apps/windows/package-lock.json apps/android/package-lock.json
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'package-lock.json',
              'apps/windows/package-lock.json',
              'apps/android/package-lock.json',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = '"version": "1.53.6"'
              if text.count(old) < 2:
                  raise SystemExit(f'{name}: expected two app version entries')
              text = text.replace(old, '"version": "1.53.7"', 2)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/normalize-v1537-locks-once.yml
      - name: Commit normalized locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize v1.53.7 lockfile updates"
          git push origin HEAD:fix/v1.53.7-draft-description-ics
