name: Normalize v1.53.7 lockfiles once

on:
  push:
    branches:
      - fix/v1.53.7-draft-description-ics

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.53.7-draft-description-ics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore lockfiles then apply only the version bump
        run: |
          git checkout origin/main -- package-lock.json apps/windows/package-lock.json apps/android/package-lock.json
          node scripts/set-version.mjs 1.53.7
          rm .github/workflows/normalize-v1537-locks-once.yml
      - name: Commit normalized locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize v1.53.7 lockfile updates"
          git push origin HEAD:fix/v1.53.7-draft-description-ics
