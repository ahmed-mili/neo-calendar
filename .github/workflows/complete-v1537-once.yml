name: Complete v1.53.7 once

on:
  push:
    branches:
      - fix/v1.53.7-draft-description-ics

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.53.7-draft-description-ics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Apply final integration
        run: |
          python3 scripts/complete-v1537.py
          sed -i 's#../../../../src/types"#../../../../src/types/schema"#' apps/windows/src/platform/icalNoteSync.test.ts

      - name: Format changed TypeScript
        run: >-
          npx prettier --write
          apps/windows/src/DesktopCalendar.tsx
          apps/windows/src/platform/desktopExternalCalendars.ts
          apps/windows/src/platform/icalNoteSync.ts
          apps/windows/src/platform/icalNoteSync.test.ts
          src/ui/calendar/draftPreviewBox.ts
          src/ui/calendar/draftPreviewBox.test.ts

      - name: Set version 1.53.7
        run: node scripts/set-version.mjs 1.53.7

      - name: Run regression suite
        run: npm test

      - name: Install Windows dependencies
        run: npm --prefix apps/windows install --no-audit --no-fund

      - name: Build Windows frontend
        run: npm --prefix apps/windows run build

      - name: Install Android dependencies
        run: npm --prefix apps/android install --no-audit --no-fund

      - name: Build Android frontend
        run: npm --prefix apps/android run build

      - name: Remove one-shot helpers
        run: rm scripts/complete-v1537.py .github/workflows/complete-v1537-once.yml

      - name: Commit validated v1.53.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete note-backed iCalendar sync for v1.53.7"
          git push origin HEAD:fix/v1.53.7-draft-description-ics
