name: Prepare version 1.54.0

on:
    push:
        branches:
            - "chore/version-1.54.0"

permissions:
    contents: write

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: chore/version-1.54.0
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
            - name: Synchroniser la version
              run: |
                  node scripts/set-version.mjs 1.54.0
                  test "$(node -p "require('./package.json').version")" = "1.54.0"
                  rm .github/workflows/version-1.54.0.yml
            - name: Committer le bump atomique
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Bump version to 1.54.0"
                  git push origin HEAD:chore/version-1.54.0
