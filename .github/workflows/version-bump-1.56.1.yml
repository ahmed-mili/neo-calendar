name: Prepare version 1.56.1

on:
    push:
        branches:
            - "chore/version-1.56.1"

permissions:
    contents: write

jobs:
    bump:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  ref: chore/version-1.56.1
                  fetch-depth: 0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "20"

            - name: Synchronize all version files
              run: node scripts/set-version.mjs 1.56.1

            - name: Commit version 1.56.1
              run: |
                  rm .github/workflows/version-bump-1.56.1.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Version 1.56.1"
                  git push origin HEAD:chore/version-1.56.1
