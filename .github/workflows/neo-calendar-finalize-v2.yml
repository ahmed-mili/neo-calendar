name: Finalize event panel refresh v2

on:
    push:
        branches:
            - ui/notion-panel-final

permissions:
    contents: write

jobs:
    finalize:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  ref: ui/notion-panel-final

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json

            - name: Reuse the complete transformer
              shell: bash
              run: |
                  python3 <<'PY'
                  from pathlib import Path

                  workflow = Path('.github/workflows/neo-calendar-finalize.yml').read_text(encoding='utf-8').splitlines()
                  step = next(i for i, line in enumerate(workflow) if line.strip() == '- name: Apply the complete panel refresh')
                  run_line = next(i for i in range(step + 1, len(workflow)) if workflow[i].strip() == 'run: |')
                  run_indent = len(workflow[run_line]) - len(workflow[run_line].lstrip())
                  block_indent = run_indent + 4
                  body = []
                  for line in workflow[run_line + 1:]:
                      if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                          break
                      if line.strip():
                          if len(line) < block_indent:
                              raise RuntimeError(f'Unexpected transformer indentation: {line!r}')
                          body.append(line[block_indent:])
                      else:
                          body.append('')
                  if not body or not body[0].startswith("python3 <<'PY'"):
                      raise RuntimeError('Could not extract the original transformer')
                  Path('/tmp/apply-panel-refresh.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
                  PY
                  bash /tmp/apply-panel-refresh.sh

            - name: Correct discriminated first-run findings
              shell: bash
              run: |
                  python3 <<'PY'
                  from pathlib import Path

                  def replace_once(text: str, old: str, new: str, label: str) -> str:
                      count = text.count(old)
                      if count != 1:
                          raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
                      return text.replace(old, new, 1)

                  rows_path = Path('src/ui/calendar/EventPanelRows.tsx')
                  rows = rows_path.read_text(encoding='utf-8')
                  rows = replace_once(
                      rows,
                      '    const android = isAndroidRuntime();\n',
                      '''    const android = isAndroidRuntime();\n    const entryKinds: Array<{ key: EntryKind; label: string }> = [\n        { key: "event", label: t("Event") },\n        { key: "task", label: t("Task") },\n        { key: "birthday", label: t("Birthday") },\n    ];\n''',
                      'header entry kind options',
                  )
                  if rows.count('ENTRY_KINDS') != 2:
                      raise RuntimeError(f'ENTRY_KINDS: expected 2 generated references, found {rows.count("ENTRY_KINDS")}')
                  rows = rows.replace('ENTRY_KINDS', 'entryKinds')
                  rows_path.write_text(rows, encoding='utf-8')

                  header_test_path = Path('src/ui/calendar/EventPanelHeader.test.tsx')
                  test = header_test_path.read_text(encoding='utf-8')
                  test = replace_once(
                      test,
                      'import { PanelHeader, TitleRow } from "./EventPanelRows";\n',
                      'import { PanelHeader, TitleRow } from "./EventPanelRows";\nimport { t } from "../i18n";\n',
                      'header test i18n import',
                  )
                  test = replace_once(
                      test,
                      'expect(field.placeholder).toBe("Title");',
                      'expect(field.placeholder).toBe(t("Title"));',
                      'localized title expectation',
                  )
                  test = replace_once(
                      test,
                      'act(() => ReactDOM.render(<Harness />, host));',
                      'act(() => { ReactDOM.render(<Harness />, host); });',
                      'title render act callback',
                  )
                  header_test_path.write_text(test, encoding='utf-8')

                  dialog_test_path = Path('src/ui/calendar/RecurringScopeDialog.test.tsx')
                  test = dialog_test_path.read_text(encoding='utf-8')
                  test = replace_once(
                      test,
                      'import { RecurringEditChange } from "./recurringEditChanges";\n',
                      'import { RecurringEditChange } from "./recurringEditChanges";\nimport { t } from "../i18n";\n',
                      'dialog test i18n import',
                  )
                  test = replace_once(test, 'toContain("Edit recurring event")', 'toContain(t("Edit recurring event"))', 'dialog title')
                  test = replace_once(test, 'toContain("Changes")', 'toContain(t("Changes"))', 'changes heading')
                  test = replace_once(test, 'button("This event only")', 'button(t("This event only"))', 'occurrence button')
                  test = replace_once(test, 'button("All events")', 'button(t("All events"))', 'series button')
                  test = replace_once(test, 'button("Cancel")', 'button(t("Cancel"))', 'cancel button')
                  dialog_test_path.write_text(test, encoding='utf-8')
                  PY

            - name: Set version 1.53.9 everywhere
              run: node scripts/set-version.mjs 1.53.9

            - name: Install root dependencies
              run: npm install --no-audit --no-fund

            - name: Install Windows dependencies
              run: npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund

            - name: Install Android dependencies
              run: npm --prefix apps/android install --ignore-scripts --no-audit --no-fund

            - name: Format changed TypeScript
              shell: bash
              run: |
                  npx prettier --write \
                    src/ui/calendar/EventPanelRows.tsx \
                    src/ui/calendar/EventPanel.tsx \
                    src/ui/calendar/DescriptionSection.tsx \
                    src/ui/calendar/recurringEditChanges.ts \
                    src/ui/calendar/recurringEditChanges.test.ts \
                    src/ui/calendar/RecurringScopeDialog.test.tsx \
                    src/ui/calendar/EventPanelHeader.test.tsx \
                    src/ui/calendar/EventPanelRefresh.style.test.ts \
                    src/ui/i18n.ts

            - name: Exact description keyboard regression
              run: npx jest src/ui/calendar/DescriptionToolbarEditing.test.tsx --runInBand

            - name: New panel regressions
              run: npx jest src/ui/calendar/EventPanelHeader.test.tsx src/ui/calendar/recurringEditChanges.test.ts src/ui/calendar/RecurringScopeDialog.test.tsx src/ui/calendar/EventPanelRefresh.style.test.ts src/ui/calendar/recurringEdit.test.ts --runInBand

            - name: Full test suite
              run: npm test

            - name: Windows frontend build
              run: npm --prefix apps/windows run build

            - name: Android frontend build
              run: npm --prefix apps/android run build

            - name: Commit finished implementation
              shell: bash
              run: |
                  set -euo pipefail
                  git rm .github/workflows/neo-calendar-finalize.yml .github/workflows/neo-calendar-finalize-v2.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git diff --cached --stat
                  git commit -m "Finish event panel refresh and recurring edit review"
                  git push origin HEAD:ui/notion-panel-final
