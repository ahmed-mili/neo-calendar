name: Temporary version bump 1.74.1

on:
  push:
    branches:
      - chore/version-1.74.1

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/version-1.74.1
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Bump synchronized version
        run: node scripts/set-version.mjs 1.74.1

      - name: Remove temporary workflow and commit release bump
        run: |
          rm .github/workflows/tmp-version-1.74.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version 1.74.1"
          git push origin HEAD:chore/version-1.74.1
