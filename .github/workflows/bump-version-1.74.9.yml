name: Bump version 1.74.9 once

on:
    push:
        branches:
            - "chore/version-1.74.9"

permissions:
    contents: write

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: chore/version-1.74.9
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
            - name: Bump synchronized release version
              run: npm run version:set -- 1.74.9
            - name: Remove one-shot workflow and commit version
              run: |
                  rm .github/workflows/bump-version-1.74.9.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Version 1.74.9"
                  git push origin HEAD:chore/version-1.74.9
