name: Format Windows focus fix

on:
  push:
    branches:
      - fix/windows-global-shift-focus-ring

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/windows-global-shift-focus-ring
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed TypeScript files
        run: npx prettier --write apps/windows/src/DesktopWindowShell.tsx apps/windows/src/DesktopFocusVisibility.test.tsx
      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/format-windows-focus-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/src/DesktopWindowShell.tsx apps/windows/src/DesktopFocusVisibility.test.tsx .github/workflows/format-windows-focus-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Windows focus fix"
          git push origin HEAD:fix/windows-global-shift-focus-ring
