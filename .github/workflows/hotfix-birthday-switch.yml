name: Birthday type-switch hotfix

on:
  push:
    branches:
      - fix/birthday-type-switch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
      - name: Apply patch
        run: python scripts/hotfix_birthday_switch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run exact regression
        run: npx jest src/ui/calendar/EventPanelHeader.test.tsx --runInBand
      - name: Commit hotfix
        run: |
          git rm .github/workflows/hotfix-birthday-switch.yml scripts/hotfix_birthday_switch.py
          git add src/ui/calendar/EventPanel.tsx src/ui/calendar/EventPanelHeader.test.tsx src/ui/calendar/entryKindSelection.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix switching Birthday back to Event"
          git push origin HEAD:fix/birthday-type-switch
