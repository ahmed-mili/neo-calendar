name: Make end date editable

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    edit:
        if: github.head_ref == 'feature/notion-date-controls'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: feature/notion-date-controls
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
            - name: Install root dependencies
              run: npm install --no-audit --no-fund
            - name: Wire the visible end date to the same date picker as the start
              shell: bash
              run: |
                  set -euo pipefail
                  node <<'NODE'
                  const fs = require('fs');

                  function replaceOnce(source, before, after, label) {
                    if (!source.includes(before)) {
                      throw new Error(`Could not find ${label}`);
                    }
                    return source.replace(before, after);
                  }

                  const rowsPath = 'src/ui/calendar/EventPanelRows.tsx';
                  let rows = fs.readFileSync(rowsPath, 'utf8');
                  rows = replaceOnce(
                    rows,
                    '    endDateLabel?: string;\n    startTime: string;',
                    '    endDateLabel?: string;\n    /** The actual date represented by endDateLabel. When present, the end of\n        the range is editable with the same picker as its start. */\n    endDate?: string;\n    startTime: string;',
                    'DateRow endDate prop'
                  );
                  rows = replaceOnce(
                    rows,
                    '    setDate: (v: string) => void;\n    setStartTime: (v: string) => void;',
                    '    setDate: (v: string) => void;\n    setEndDate?: (v: string | undefined) => void;\n    setStartTime: (v: string) => void;',
                    'DateRow setEndDate prop'
                  );
                  rows = replaceOnce(
                    rows,
                    '    endDateLabel,\n    startTime,',
                    '    endDateLabel,\n    endDate,\n    startTime,',
                    'DateRow endDate destructure'
                  );
                  rows = replaceOnce(
                    rows,
                    '    setDate,\n    setStartTime,',
                    '    setDate,\n    setEndDate,\n    setStartTime,',
                    'DateRow setEndDate destructure'
                  );
                  rows = replaceOnce(
                    rows,
                    '                                                key={i}\n                                                className={`nc-datepicker-day${',
                    '                                                key={i}\n                                                data-date-value={toISODate(day)}\n                                                className={`nc-datepicker-day${',
                    'date picker day test locator'
                  );
                  rows = replaceOnce(
                    rows,
                    `                    {endDateLabel && (\n                        <>\n                            <span className="nc-panel-arrow">\n                                <ArrowRightIcon />\n                            </span>\n                            <span className="nc-panel-date-label">\n                                {endDateLabel}\n                            </span>\n                        </>\n                    )}`,
                    `                    {endDateLabel && endDate && (\n                        <>\n                            <span className="nc-panel-arrow">\n                                <ArrowRightIcon />\n                            </span>\n                            <DateField\n                                date={endDate}\n                                label={endDateLabel}\n                                editable={editable && Boolean(setEndDate)}\n                                firstDay={firstDay}\n                                setDate={(next) =>\n                                    setEndDate?.(\n                                        next === date ? undefined : next\n                                    )\n                                }\n                                onAutoSave={onAutoSave}\n                            />\n                        </>\n                    )}`,
                    'editable end-date field'
                  );
                  fs.writeFileSync(rowsPath, rows);

                  const panelPath = 'src/ui/calendar/EventPanel.tsx';
                  let panel = fs.readFileSync(panelPath, 'utf8');
                  panel = replaceOnce(
                    panel,
                    `    const endDateLabel = useMemo(() => {\n        const end = panelEndDate(\n            form.date,\n            form.endDate,\n            form.allDay,\n            form.startTime,\n            form.endTime\n        );\n        return end ? formatPanelDate(end) : "";\n    }, [form.date, form.endDate, form.allDay, form.startTime, form.endTime]);`,
                    `    const endDateValue = useMemo(\n        () =>\n            panelEndDate(\n                form.date,\n                form.endDate,\n                form.allDay,\n                form.startTime,\n                form.endTime\n            ),\n        [form.date, form.endDate, form.allDay, form.startTime, form.endTime]\n    );\n    const endDateLabel = useMemo(\n        () => (endDateValue ? formatPanelDate(endDateValue) : ""),\n        [endDateValue]\n    );`,
                    'panel endDate computation'
                  );
                  panel = replaceOnce(
                    panel,
                    '                    endDateLabel={endDateLabel}\n                    startTime={form.startTime}',
                    '                    endDateLabel={endDateLabel}\n                    endDate={endDateValue}\n                    startTime={form.startTime}',
                    'DateRow endDate value'
                  );
                  panel = replaceOnce(
                    panel,
                    '                    setDate={form.setDate}\n                    setStartTime={form.setStartTime}',
                    '                    setDate={form.setDate}\n                    setEndDate={form.setEndDate}\n                    setStartTime={form.setStartTime}',
                    'DateRow endDate setter'
                  );
                  fs.writeFileSync(panelPath, panel);

                  const displayTestPath = 'src/ui/calendar/EventPanelDateDisplay.test.ts';
                  let displayTest = fs.readFileSync(displayTestPath, 'utf8');
                  displayTest = replaceOnce(
                    displayTest,
                    '                endDateLabel: endLabel,\n                startTime: "14:15",',
                    '                endDateLabel: endLabel,\n                endDate,\n                startTime: "14:15",',
                    'DateRow display test endDate prop'
                  );
                  fs.writeFileSync(displayTestPath, displayTest);
                  NODE
                  cat > src/ui/calendar/DateRow.end-date.test.tsx <<'EOF'
                  /** @jest-environment jsdom */

                  import * as React from "react";
                  import * as ReactDOM from "react-dom";
                  import { act } from "react-dom/test-utils";
                  import { formatPanelDate } from "./EventPanel.helpers";
                  import { DateRow } from "./EventPanelRows";

                  describe("editable multi-day end date", () => {
                      let host: HTMLDivElement;

                      beforeEach(() => {
                          host = document.createElement("div");
                          host.className = "nc-event-popup";
                          document.body.appendChild(host);
                      });

                      afterEach(() => {
                          act(() => {
                              ReactDOM.unmountComponentAtNode(host);
                          });
                          host.remove();
                      });

                      it("opens the end-date picker by a real click and updates the range", () => {
                          const setEndDate = jest.fn();
                          const onAutoSave = jest.fn();

                          act(() => {
                              ReactDOM.render(
                                  <DateRow
                                      date="2026-08-28"
                                      dateLabel={formatPanelDate("2026-08-28")}
                                      endDate="2026-08-31"
                                      endDateLabel={formatPanelDate("2026-08-31")}
                                      startTime="14:15"
                                      endTime="15:15"
                                      duration="73h"
                                      allDay={false}
                                      isRecurring={false}
                                      editable={true}
                                      firstDay={1}
                                      setDate={jest.fn()}
                                      setEndDate={setEndDate}
                                      setStartTime={jest.fn()}
                                      setEndTime={jest.fn()}
                                      onAutoSave={onAutoSave}
                                  />,
                                  host
                              );
                          });

                          const dateButtons = host.querySelectorAll<HTMLButtonElement>(
                              ".nc-panel-date-btn"
                          );
                          expect(dateButtons).toHaveLength(2);
                          expect(dateButtons[0].textContent).not.toContain("2026");
                          expect(dateButtons[1].textContent).not.toContain("2026");

                          act(() => {
                              dateButtons[1].dispatchEvent(
                                  new MouseEvent("click", { bubbles: true })
                              );
                          });

                          const nextDay = document.querySelector<HTMLButtonElement>(
                              '[data-date-value="2026-09-01"]'
                          );
                          expect(nextDay).not.toBeNull();

                          act(() => {
                              nextDay?.dispatchEvent(
                                  new MouseEvent("click", { bubbles: true })
                              );
                          });

                          expect(setEndDate).toHaveBeenCalledWith("2026-09-01");
                          expect(onAutoSave).toHaveBeenCalledTimes(1);
                      });
                  });
                  EOF
            - name: Format the edited sources
              run: |
                  npx prettier --write \
                    src/ui/calendar/EventPanelRows.tsx \
                    src/ui/calendar/EventPanel.tsx \
                    src/ui/calendar/EventPanelDateDisplay.test.ts \
                    src/ui/calendar/DateRow.end-date.test.tsx
            - name: Commit editable end date
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/ui/calendar/EventPanelRows.tsx \
                          src/ui/calendar/EventPanel.tsx \
                          src/ui/calendar/EventPanelDateDisplay.test.ts \
                          src/ui/calendar/DateRow.end-date.test.tsx
                  git commit -m "Make multi-day end date editable"
                  git push origin HEAD:feature/notion-date-controls
