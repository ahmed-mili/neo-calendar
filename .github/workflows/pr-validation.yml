name: PR validation

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json
            - name: Install root dependencies
              run: npm install --no-audit --no-fund
            - name: Install Windows dependencies
              run: npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
            - name: Install Android dependencies
              run: npm --prefix apps/android install --ignore-scripts --no-audit --no-fund
            - name: Tests
              run: npm test
            - name: Formatting
              run: npm run lint
            - name: Windows frontend build
              run: npm --prefix apps/windows run build
            - name: Android frontend build
              run: npm --prefix apps/android run build
