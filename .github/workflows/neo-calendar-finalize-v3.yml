name: Finalize event panel refresh v3

on:
    push:
        branches:
            - ui/notion-panel-final

permissions:
    contents: write

jobs:
    finalize:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  ref: ui/notion-panel-final

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json

            - name: Apply transformer and validated corrections
              shell: bash
              run: |
                  python3 <<'PY'
                  from pathlib import Path

                  def extract_step(path: str, step_name: str, out: str) -> None:
                      lines = Path(path).read_text(encoding='utf-8').splitlines()
                      step = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {step_name}')
                      run_line = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
                      run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
                      block_indent = run_indent + 4
                      body = []
                      for line in lines[run_line + 1:]:
                          if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                              break
                          body.append(line[block_indent:] if line.strip() else '')
                      Path(out).write_text('\n'.join(body) + '\n', encoding='utf-8')

                  extract_step('.github/workflows/neo-calendar-finalize.yml', 'Apply the complete panel refresh', '/tmp/apply.sh')
                  extract_step('.github/workflows/neo-calendar-finalize-v2.yml', 'Correct discriminated first-run findings', '/tmp/fix.sh')
                  fix = Path('/tmp/fix.sh').read_text(encoding='utf-8')
                  fix = fix.replace("rows.count('ENTRY_KINDS') != 2", "rows.count('ENTRY_KINDS') != 3")
                  fix = fix.replace('expected 2 generated references', 'expected 3 generated references')
                  Path('/tmp/fix.sh').write_text(fix, encoding='utf-8')
                  PY
                  bash /tmp/apply.sh
                  bash /tmp/fix.sh

            - name: Set version 1.53.9 everywhere
              run: node scripts/set-version.mjs 1.53.9

            - name: Install dependencies
              shell: bash
              run: |
                  npm install --no-audit --no-fund
                  npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund
                  npm --prefix apps/android install --ignore-scripts --no-audit --no-fund

            - name: Format changed TypeScript
              shell: bash
              run: |
                  npx prettier --write \
                    src/ui/calendar/EventPanelRows.tsx \
                    src/ui/calendar/EventPanel.tsx \
                    src/ui/calendar/DescriptionSection.tsx \
                    src/ui/calendar/recurringEditChanges.ts \
                    src/ui/calendar/recurringEditChanges.test.ts \
                    src/ui/calendar/RecurringScopeDialog.test.tsx \
                    src/ui/calendar/EventPanelHeader.test.tsx \
                    src/ui/calendar/EventPanelRefresh.style.test.ts \
                    src/ui/i18n.ts

            - name: Exact description keyboard regression
              run: npx jest src/ui/calendar/DescriptionToolbarEditing.test.tsx --runInBand

            - name: New panel regressions
              run: npx jest src/ui/calendar/EventPanelHeader.test.tsx src/ui/calendar/recurringEditChanges.test.ts src/ui/calendar/RecurringScopeDialog.test.tsx src/ui/calendar/EventPanelRefresh.style.test.ts src/ui/calendar/recurringEdit.test.ts --runInBand

            - name: Full test suite
              run: npm test

            - name: Windows frontend build
              run: npm --prefix apps/windows run build

            - name: Android frontend build
              run: npm --prefix apps/android run build

            - name: Commit finished implementation
              shell: bash
              run: |
                  set -euo pipefail
                  git rm \
                    .github/workflows/neo-calendar-finalize.yml \
                    .github/workflows/neo-calendar-finalize-v2.yml \
                    .github/workflows/neo-calendar-finalize-v3.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git diff --cached --stat
                  git commit -m "Finish event panel refresh and recurring edit review"
                  git push origin HEAD:ui/notion-panel-final
