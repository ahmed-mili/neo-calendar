name: Fix Birthday timed-position restore

on:
    push:
        branches:
            - fix/birthday-restore-timed-position

permissions:
    contents: write

jobs:
    patch:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "20"
                  cache: npm
            - name: Apply patch
              run: python .github/scripts/fix_birthday_timed_restore.py
            - name: Install dependencies
              run: npm install --no-audit --no-fund
            - name: Format changed files
              run: npx prettier --write src/ui/calendar/entryKindSelection.ts src/ui/calendar/EventPanel.tsx src/ui/calendar/EventPanelHeader.test.tsx
            - name: Run exact regression
              run: npx jest src/ui/calendar/EventPanelHeader.test.tsx --runInBand
            - name: Commit fix
              shell: bash
              run: |
                  git rm .github/workflows/fix-birthday-timed-restore.yml .github/scripts/fix_birthday_timed_restore.py
                  git add src/ui/calendar/entryKindSelection.ts src/ui/calendar/EventPanel.tsx src/ui/calendar/EventPanelHeader.test.tsx
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Restore timed event position after Birthday"
                  git push origin HEAD:fix/birthday-restore-timed-position
