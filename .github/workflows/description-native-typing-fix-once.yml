name: Verify description native typing fix

on:
  push:
    branches:
      - fix/description-native-typing

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/description-native-typing
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore source formatting from main
        run: git checkout origin/main -- src/ui/calendar/DescriptionSection.tsx src/ui/calendar/EventPanel.tsx src/ui/calendar/DescriptionToolbarEditing.test.tsx

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply direct typing fix and regression coverage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/ui/calendar/DescriptionSection.tsx",
              '''            onInputCapture={(event) => {
                          const field = event.target;
                          if (field instanceof HTMLTextAreaElement) updateMention(field);
                      }}
                      onSelectCapture={(event) => {
                          const field = event.target;
                          if (field instanceof HTMLTextAreaElement) updateMention(field);
                      }}''',
              '''            onInput={(event) => {
                          const field = event.target;
                          if (!(field instanceof HTMLTextAreaElement)) return;
                          // Mention bookkeeping must not re-render a controlled
                          // textarea during the native input event. WebView2 can
                          // otherwise restore the previous controlled value before
                          // React receives the change, making physical keystrokes
                          // look as if they were ignored.
                          window.requestAnimationFrame(() => {
                              if (field.isConnected) updateMention(field);
                          });
                      }}
                      onSelect={(event) => {
                          const field = event.target;
                          if (field instanceof HTMLTextAreaElement) updateMention(field);
                      }}'''
          )

          replace_once(
              "src/ui/calendar/DescriptionSection.tsx",
              '''                <div className="nc-panel-row nc-panel-row-desc nc-description-composer">''',
              '''                <div
                          className="nc-panel-row nc-panel-row-desc nc-description-composer"
                          onClick={(event) => {
                              if (!editable) return;
                              const target = event.target;
                              if (!(target instanceof Element)) return;
                              // The toolbar made the visual Description surface much
                              // taller than the textarea itself. Treat the whole
                              // non-interactive surface as the text field so a real
                              // click/tap always activates keyboard input.
                              if (
                                  target.closest(
                                      "button, a, input, textarea, select, [role='button'], [role='link']"
                                  )
                              ) {
                                  return;
                              }
                              const field = fieldRef.current;
                              if (!field?.isConnected) return;
                              activeFieldRef.current = field;
                              field.focus();
                              const caret = field.value.length;
                              field.setSelectionRange(caret, caret);
                          }}
                      >'''
          )

          replace_once(
              "src/ui/calendar/DescriptionSection.tsx",
              '''                            onChange={(event) =>
                                          setDescription(event.target.value)
                                      }''',
              '''                            onChange={(event) => {
                                          const value = event.target.value;
                                          // Keep the imperative snapshot in lockstep with
                                          // native typing; toolbar/mention logic reads it
                                          // before the next React render on some WebViews.
                                          descriptionRef.current = value;
                                          setDescription(value);
                                      }}'''
          )

          replace_once(
              "src/ui/calendar/EventPanel.tsx",
              '''        if (isNeoAndroidRuntime()) {
                      const active = document.activeElement;
          
                      if (active instanceof HTMLElement) {
                          active.blur();
                      }
          
                      titleInputRef.current?.blur();
          
                      window.setTimeout(() => {
                          const current = document.activeElement;
          
                          if (current instanceof HTMLElement) {
                              current.blur();
                          }
          
                          titleInputRef.current?.blur();
                      }, 80);
          
                      return;
                  }''',
              '''        if (isNeoAndroidRuntime()) {
                      // Android opens drafts without forcing the title keyboard.
                      // Never blur whichever element the user has chosen in the
                      // meantime: the old delayed blanket blur could cancel a tap
                      // on Description just after the sheet appeared.
                      if (document.activeElement === titleInputRef.current) {
                          titleInputRef.current?.blur();
                      }
          
                      window.setTimeout(() => {
                          if (document.activeElement === titleInputRef.current) {
                              titleInputRef.current?.blur();
                          }
                      }, 80);
          
                      return;
                  }'''
          )

          replace_once(
              "src/ui/calendar/EventPanel.tsx",
              '''        requestAnimationFrame(() => {
                      titleInputRef.current?.focus();
                  });''',
              '''        requestAnimationFrame(() => {
                      const active = document.activeElement;
                      const editingElsewhere =
                          active instanceof HTMLInputElement ||
                          active instanceof HTMLTextAreaElement ||
                          active instanceof HTMLSelectElement ||
                          (active instanceof HTMLElement && active.isContentEditable);
                      // A fast click into Description during draft → event handoff
                      // wins over the legacy title refocus. Do not steal the caret.
                      if (editingElsewhere) return;
                      titleInputRef.current?.focus();
                  });'''
          )

          test_path = Path("src/ui/calendar/DescriptionToolbarEditing.test.tsx")
          test = test_path.read_text()
          helper_anchor = '''    const flushAnimationFrames = () => {
                  const callbacks = animationFrames.splice(0);
                  act(() => callbacks.forEach((callback) => callback(0)));
              };
          '''
          helper = helper_anchor + '''
              const nativeInput = (field: HTMLTextAreaElement, value: string) => {
                  const setter = Object.getOwnPropertyDescriptor(
                      HTMLTextAreaElement.prototype,
                      "value"
                  )?.set;
                  expect(setter).toBeTruthy();
                  act(() => {
                      setter?.call(field, value);
                      field.dispatchEvent(new Event("input", { bubbles: true }));
                  });
              };
          '''
          if helper_anchor not in test:
              raise SystemExit("test helper anchor not found")
          test = test.replace(helper_anchor, helper, 1)

          new_tests = '''
              it("focuses the editor when the unified Description surface is clicked", () => {
                  act(() => {
                      ReactDOM.render(<Harness />, container);
                  });
          
                  const composer = container.querySelector(
                      ".nc-description-composer"
                  ) as HTMLDivElement;
                  const field = container.querySelector(
                      "textarea[data-description-input='true']"
                  ) as HTMLTextAreaElement;
                  expect(document.activeElement).not.toBe(field);
          
                  act(() => Simulate.click(composer));
                  expect(document.activeElement).toBe(field);
          
                  nativeInput(field, "hello from the keyboard");
                  expect(field.value).toBe("hello from the keyboard");
                  nativeInput(field, "hello from the keyboar");
                  expect(field.value).toBe("hello from the keyboar");
              });
          
              it("accepts native typing and deletion after Bold creates the four stars", () => {
                  act(() => {
                      ReactDOM.render(<Harness />, container);
                  });
          
                  const bold = container.querySelector(
                      "button[data-format-command='bold']"
                  ) as HTMLButtonElement;
                  act(() => {
                      Simulate.mouseDown(bold, { button: 0 });
                      Simulate.click(bold);
                  });
                  flushAnimationFrames();
          
                  const field = container.querySelector(
                      "textarea[data-description-input='true']"
                  ) as HTMLTextAreaElement;
                  expect(field.value).toBe("****");
                  expect(document.activeElement).toBe(field);
          
                  nativeInput(field, "**hello**");
                  expect(field.value).toBe("**hello**");
                  nativeInput(field, "**hello*");
                  expect(field.value).toBe("**hello*");
              });
          '''
          closing = "\n});\n"
          at = test.rfind(closing)
          if at < 0:
              raise SystemExit("test suite closing anchor not found")
          test = test[:at] + new_tests + test[at:]
          test_path.write_text(test)
          PY

          npx prettier --write src/ui/calendar/DescriptionSection.tsx src/ui/calendar/EventPanel.tsx src/ui/calendar/DescriptionToolbarEditing.test.tsx

      - name: Run full test suite
        run: npm test

      - name: Commit normalized verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/calendar/DescriptionSection.tsx src/ui/calendar/EventPanel.tsx src/ui/calendar/DescriptionToolbarEditing.test.tsx
          git commit -m "Normalize description native typing fix"
          git push origin HEAD:fix/description-native-typing
