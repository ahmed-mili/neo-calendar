name: Normalize root lockfile (one time)

on:
  push:
    branches:
      - feature/description-ctrl-k-link-dialog

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/description-ctrl-k-link-dialog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore root lockfile formatting and keep 1.53.6
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          let text = fs.readFileSync(path, 'utf8');
          let seen = 0;
          text = text.replace(/"version": "[^"]+"/g, (match) => {
            seen += 1;
            return seen <= 2 ? '"version": "1.53.6"' : match;
          });
          if (seen < 2) throw new Error('Root lockfile version entries not found');
          fs.writeFileSync(path, text);
          NODE
      - name: Re-run regression suite
        run: npm test
      - name: Commit normalized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Keep root lockfile formatting stable"
          git push origin HEAD:feature/description-ctrl-k-link-dialog
