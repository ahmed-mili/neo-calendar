name: Prepare version 1.74.8

on:
    push:
        branches:
            - "chore/version-1.74.8"

permissions:
    contents: write

jobs:
    bump:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "20"

            - name: Bump patch version everywhere
              run: node scripts/set-version.mjs patch

            - name: Verify synchronized release metadata
              run: node --test scripts/set-version.test.mjs scripts/version-sync.test.mjs

            - name: Remove one-shot workflow and commit bump
              run: |
                  git rm .github/workflows/prepare-version-1.74.8.yml
                  git add package.json package-lock.json \
                    apps/windows/package.json apps/windows/package-lock.json \
                    apps/windows/src-tauri/tauri.conf.json \
                    apps/windows/src-tauri/Cargo.toml \
                    apps/windows/src-tauri/Cargo.lock \
                    apps/android/package.json apps/android/package-lock.json \
                    apps/android/native/app/build.gradle.kts
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Version 1.74.8"
                  git push origin HEAD:chore/version-1.74.8
