name: Finalize event panel refresh

on:
    push:
        branches:
            - ui/notion-panel-final

permissions:
    contents: write

jobs:
    finalize:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  ref: ui/notion-panel-final

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json
                      apps/android/package-lock.json

            - name: Apply the complete panel refresh
              shell: bash
              run: |
                  python3 <<'PY'
                  from pathlib import Path
                  import re

                  root = Path('.')

                  def read(path):
                      return (root / path).read_text(encoding='utf-8')

                  def write(path, text):
                      (root / path).write_text(text, encoding='utf-8')

                  def replace_once(text, old, new, label):
                      count = text.count(old)
                      if count != 1:
                          raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
                      return text.replace(old, new, 1)

                  # ── A. Type selector in the header + title simplification ─────
                  rows_path = 'src/ui/calendar/EventPanelRows.tsx'
                  rows = read(rows_path)
                  rows = replace_once(
                      rows,
                      'import { RecurringEditScope } from "./recurringEdit";\n',
                      'import { RecurringEditScope } from "./recurringEdit";\nimport type { RecurringEditChange } from "./recurringEditChanges";\n',
                      'RecurringEditChange import',
                  )

                  header_start = rows.index('interface PanelHeaderProps {')
                  header_end = rows.index('// ── Title row', header_start)
                  header = r'''interface PanelHeaderProps {
                      isDraft: boolean;
                      isTask: boolean;
                      kind: EntryKind;
                      setKind: (kind: EntryKind) => void;
                      editable: boolean;
                      eventId: string | null;
                      menuOpen: boolean;
                      menuRef: React.RefObject<HTMLDivElement>;
                      onHeaderMouseDown: (e: React.MouseEvent) => void;
                      onToggleMenu: () => void;
                      onOpenFile: (id: string) => void;
                      onCopyFilePath?: (id: string) => void;
                      onDuplicate?: (id: string) => void;
                      onDeleteClick: () => void;
                      onClose: () => void;
                      headerRef?: React.RefObject<HTMLDivElement>;
                      sheetHandle?: { glyph: "up" | "bar" | "down"; onPress: () => void };
                  }

                  export function PanelHeader({
                      isDraft,
                      isTask,
                      kind,
                      setKind,
                      editable,
                      eventId,
                      menuOpen,
                      menuRef,
                      headerRef,
                      onHeaderMouseDown,
                      onToggleMenu,
                      onOpenFile,
                      onCopyFilePath,
                      onDuplicate,
                      onDeleteClick,
                      onClose,
                      sheetHandle,
                  }: PanelHeaderProps) {
                      const android = isAndroidRuntime();
                      const kindTriggerRef = React.useRef<HTMLButtonElement>(null);
                      const kindMenuRef = React.useRef<HTMLDivElement>(null);
                      const [kindOpen, setKindOpen] = React.useState(false);
                      const [kindMenuStyle, setKindMenuStyle] = React.useState<React.CSSProperties>({});
                      const selectedKind = ENTRY_KINDS.find((entry) => entry.key === kind) ?? ENTRY_KINDS[0];

                      const toggleKind = (event: React.MouseEvent<HTMLButtonElement>) => {
                          event.preventDefault();
                          event.stopPropagation();
                          if (!editable) return;
                          if (kindOpen) {
                              setKindOpen(false);
                              return;
                          }
                          const rect = kindTriggerRef.current?.getBoundingClientRect();
                          if (!rect) return;
                          const placement = placeFlyout(rect, window.innerHeight, {
                              gap: 4,
                              margin: 8,
                              minHeight: 132,
                          });
                          const width = 176;
                          const left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8));
                          setKindMenuStyle({
                              left,
                              width,
                              top: placement.top ?? undefined,
                              bottom: placement.bottom ?? undefined,
                              maxHeight: placement.maxHeight,
                          });
                          setKindOpen(true);
                      };

                      React.useEffect(() => {
                          if (!kindOpen) return;
                          const close = (event: PointerEvent) => {
                              const target = event.target as Node;
                              if (kindTriggerRef.current?.contains(target)) return;
                              if (kindMenuRef.current?.contains(target)) return;
                              setKindOpen(false);
                          };
                          const closeForLayout = () => setKindOpen(false);
                          document.addEventListener("pointerdown", close, true);
                          window.addEventListener("resize", closeForLayout);
                          window.addEventListener("scroll", closeForLayout, true);
                          return () => {
                              document.removeEventListener("pointerdown", close, true);
                              window.removeEventListener("resize", closeForLayout);
                              window.removeEventListener("scroll", closeForLayout, true);
                          };
                      }, [kindOpen]);

                      return (
                          <>
                              <div
                                  className="nc-panel-header"
                                  ref={headerRef}
                                  onMouseDown={onHeaderMouseDown}
                              >
                                  {sheetHandle && (
                                      <button
                                          type="button"
                                          className={`nc-sheet-handle nc-sheet-handle--${sheetHandle.glyph}`}
                                          aria-label={t("Resize panel")}
                                          onClick={sheetHandle.onPress}
                                      >
                                          <SheetHandleGlyph glyph={sheetHandle.glyph} />
                                      </button>
                                  )}

                                  <button
                                      ref={kindTriggerRef}
                                      type="button"
                                      className="nc-panel-kind-trigger"
                                      aria-label={t("Type")}
                                      aria-haspopup="menu"
                                      aria-expanded={kindOpen}
                                      disabled={!editable}
                                      onPointerDown={(event) => event.stopPropagation()}
                                      onMouseDown={(event) => event.stopPropagation()}
                                      onClick={toggleKind}
                                  >
                                      <span>{selectedKind.label}</span>
                                      {editable && <ChevronDownIcon size={13} />}
                                  </button>

                                  <div className="nc-panel-header-actions">
                                      <div className="nc-panel-menu-wrap" ref={menuRef}>
                                          <button
                                              type="button"
                                              className="nc-panel-icon-btn"
                                              title={t("More")}
                                              onClick={onToggleMenu}
                                          >
                                              <DotsIcon />
                                          </button>
                                          {menuOpen && (
                                              <div className="nc-panel-menu">
                                                  {!isDraft && eventId && !android && (
                                                      <button
                                                          type="button"
                                                          className="nc-panel-menu-item"
                                                          onClick={() => onOpenFile(eventId)}
                                                      >
                                                          <NoteIcon size={15} />
                                                          <span>{t("Open note")}</span>
                                                      </button>
                                                  )}
                                                  {!isDraft &&
                                                      editable &&
                                                      eventId &&
                                                      !android &&
                                                      onCopyFilePath && (
                                                          <button
                                                              type="button"
                                                              className="nc-panel-menu-item"
                                                              onClick={() => onCopyFilePath(eventId)}
                                                          >
                                                              <CopyIcon size={15} />
                                                              <span>{t("Copy path")}</span>
                                                          </button>
                                                      )}
                                                  {!isDraft &&
                                                      editable &&
                                                      eventId &&
                                                      android &&
                                                      onDuplicate && (
                                                          <button
                                                              type="button"
                                                              className="nc-panel-menu-item"
                                                              onClick={() => onDuplicate(eventId)}
                                                          >
                                                              <DuplicateIcon size={15} />
                                                              <span>{t("Duplicate")}</span>
                                                          </button>
                                                      )}
                                                  {!isDraft && editable && eventId && (
                                                      <button
                                                          type="button"
                                                          className="nc-panel-menu-item nc-danger"
                                                          onClick={onDeleteClick}
                                                      >
                                                          <TrashIcon size={15} />
                                                          <span>
                                                              {isTask ? t("Delete task") : t("Delete event")}
                                                          </span>
                                                      </button>
                                                  )}
                                              </div>
                                          )}
                                      </div>
                                      <button
                                          type="button"
                                          className="nc-panel-icon-btn"
                                          title={t("Close")}
                                          onPointerUp={
                                              isAndroidRuntime()
                                                  ? (event) => {
                                                        event.preventDefault();
                                                        swallowNextClick();
                                                        onClose();
                                                    }
                                                  : undefined
                                          }
                                          onClick={isAndroidRuntime() ? undefined : onClose}
                                      >
                                          <XIcon />
                                      </button>
                                  </div>
                              </div>

                              {kindOpen &&
                                  ReactDOM.createPortal(
                                      <div
                                          ref={kindMenuRef}
                                          className="nc-panel-kind-menu"
                                          role="menu"
                                          style={kindMenuStyle}
                                          data-nc-popup-portal="true"
                                          onPointerDown={(event) => event.stopPropagation()}
                                          onMouseDown={(event) => event.stopPropagation()}
                                      >
                                          {ENTRY_KINDS.map((entry) => (
                                              <button
                                                  key={entry.key}
                                                  type="button"
                                                  role="menuitemradio"
                                                  aria-checked={kind === entry.key}
                                                  className={`nc-panel-kind-option${
                                                      kind === entry.key ? " nc-active" : ""
                                                  }`}
                                                  data-kind={entry.key}
                                                  onClick={(event) => {
                                                      event.stopPropagation();
                                                      setKindOpen(false);
                                                      if (entry.key !== kind) setKind(entry.key);
                                                  }}
                                              >
                                                  <span>{entry.label}</span>
                                                  {kind === entry.key && <CheckMarkIcon size={14} />}
                                              </button>
                                          ))}
                                      </div>,
                                      getEventPanelPortalTarget()
                                  )}
                          </>
                      );
                  }

                  '''
                  rows = rows[:header_start] + header + rows[header_end:]

                  rows = replace_once(
                      rows,
                      '''            <span className="nc-panel-title-icon">\n                <FileTextIcon />\n            </span>\n''',
                      '',
                      'title icon',
                  )
                  rows = replace_once(
                      rows,
                      'placeholder={t("Event Name")}',
                      'placeholder={t("Title")}',
                      'title placeholder',
                  )

                  type_start = rows.index('interface TypeRowProps {')
                  type_end = rows.index('// ── Status row', type_start)
                  rows = rows[:type_start] + rows[type_end:]

                  # ── C. Compact recurring edit review dialog ─────────────────
                  dialog_start = rows.index('interface RecurringScopeDialogProps {')
                  dialog_end = rows.index('// ── Description row', dialog_start)
                  dialog = r'''interface RecurringScopeDialogProps {
                      isTask: boolean;
                      changes: RecurringEditChange[];
                      onCancel: () => void;
                      onConfirm: (scope: RecurringEditScope) => void;
                  }

                  /**
                   * One decision, made on exit, with the exact pending diff visible.
                   * The buttons map directly to the two persistence paths in EventPanel:
                   * occurrence keeps the detachment contract; series keeps the full update.
                   */
                  export function RecurringScopeDialog({
                      isTask,
                      changes,
                      onCancel,
                      onConfirm,
                  }: RecurringScopeDialogProps) {
                      React.useEffect(() => {
                          const onKey = (event: KeyboardEvent) => {
                              if (event.key !== "Escape") return;
                              event.preventDefault();
                              event.stopPropagation();
                              onCancel();
                          };
                          document.addEventListener("keydown", onKey, true);
                          return () => document.removeEventListener("keydown", onKey, true);
                      }, [onCancel]);

                      return ReactDOM.createPortal(
                          <div
                              className="nc-scope-overlay"
                              role="dialog"
                              aria-modal="true"
                              aria-labelledby="nc-scope-title"
                              onMouseDown={(event) => {
                                  if (event.target === event.currentTarget) onCancel();
                              }}
                          >
                              <div className="nc-scope-dialog">
                                  <div className="nc-scope-title" id="nc-scope-title">
                                      {isTask
                                          ? t("Edit recurring task")
                                          : t("Edit recurring event")}
                                  </div>
                                  <div className="nc-scope-subtitle">
                                      {t("Choose how to apply these changes.")}
                                  </div>

                                  {changes.length > 0 && (
                                      <div className="nc-scope-changes">
                                          <div className="nc-scope-changes-title">{t("Changes")}</div>
                                          <div className="nc-scope-change-list">
                                              {changes.map((change) => (
                                                  <div className="nc-scope-change" key={change.key}>
                                                      <div className="nc-scope-change-label">
                                                          {t(change.label)}
                                                      </div>
                                                      <div className="nc-scope-change-values">
                                                          <span className="nc-scope-change-before">
                                                              {t(change.before)}
                                                          </span>
                                                          <ArrowRightIcon size={13} />
                                                          <span className="nc-scope-change-after">
                                                              {t(change.after)}
                                                          </span>
                                                      </div>
                                                  </div>
                                              ))}
                                          </div>
                                      </div>
                                  )}

                                  <div className="nc-scope-choice-actions">
                                      <button
                                          type="button"
                                          className="nc-scope-choice-btn"
                                          onClick={() => onConfirm("occurrence")}
                                      >
                                          {isTask ? t("This task only") : t("This event only")}
                                      </button>
                                      <button
                                          type="button"
                                          className="nc-scope-choice-btn"
                                          onClick={() => onConfirm("series")}
                                      >
                                          {isTask ? t("All tasks") : t("All events")}
                                      </button>
                                  </div>

                                  <button
                                      type="button"
                                      className="nc-scope-cancel-btn"
                                      onClick={onCancel}
                                  >
                                      {t("Cancel")}
                                  </button>
                              </div>
                          </div>,
                          getEventPanelPortalTarget()
                      );
                  }

                  '''
                  rows = rows[:dialog_start] + dialog + rows[dialog_end:]
                  write(rows_path, rows)

                  # ── EventPanel wiring and section structure ───────────────────
                  panel_path = 'src/ui/calendar/EventPanel.tsx'
                  panel = read(panel_path)
                  panel = replace_once(panel, '    TypeRow,\n', '', 'TypeRow import')
                  panel = replace_once(
                      panel,
                      '} from "./recurringEdit";\n',
                      '} from "./recurringEdit";\nimport { recurringEditChanges } from "./recurringEditChanges";\n',
                      'recurringEditChanges import',
                  )
                  panel = replace_once(
                      panel,
                      '                isTask={isTask}\n                label={headerLabel}\n                editable={stableCalInfo.editable}\n',
                      '                isTask={isTask}\n                kind={entryKind}\n                setKind={setEntryKind}\n                editable={stableCalInfo.editable}\n',
                      'PanelHeader kind props',
                  )

                  # Remove the full type row from the body.
                  panel = replace_once(
                      panel,
                      '''\n                {/* What it is, before anything else about it. */}\n                <TypeRow\n                    kind={entryKind}\n                    editable={stableCalInfo.editable}\n                    setKind={setEntryKind}\n                />\n''',
                      '',
                      'TypeRow render',
                  )

                  # Header text is now the type selector itself; task status keeps its own status row.
                  header_label_pattern = re.compile(
                      r'\n    /\* Le coin du panneau :.*?\n    const headerLabel = isTask.*?\n        : t\("Event"\);\n',
                      re.S,
                  )
                  panel, n = header_label_pattern.subn('\n', panel, count=1)
                  if n != 1:
                      raise RuntimeError(f'headerLabel block: expected 1, found {n}')

                  # Group schedule rows without reordering any existing behavior.
                  date_marker = '                <DateRow\n'
                  cal_marker = '                <CalendarRow\n'
                  desc_marker = '                <DescriptionSection\n'
                  if panel.count(date_marker) != 1 or panel.count(cal_marker) != 1 or panel.count(desc_marker) != 1:
                      raise RuntimeError('section markers were not unique')
                  panel = panel.replace(
                      date_marker,
                      '                <div className="nc-panel-section nc-panel-section-schedule">\n' +
                      '                    <DateRow\n',
                      1,
                  )
                  panel = panel.replace(
                      cal_marker,
                      '                </div>\n\n                <div className="nc-panel-section nc-panel-section-properties">\n' +
                      '                    <CalendarRow\n',
                      1,
                  )
                  panel = panel.replace(
                      desc_marker,
                      '                </div>\n\n                <DescriptionSection\n',
                      1,
                  )

                  # The new dialog reviews the exact payload that the unchanged persistence path receives.
                  scope_guard = '''    const androidDraft = isDraft && isNeoAndroidRuntime();\n    const portalTarget = isNeoAndroidRuntime()\n        ? document.getElementById("nc-android-overlay-root") ?? document.body\n        : document.body;\n    // NEO_ANDROID_PORTAL_TARGET_V3_END\n'''
                  scope_insert = scope_guard + '''\n    const scopeChanges =\n        scopeAsked && stableEvent\n            ? recurringEditChanges(stableEvent, form.buildPayload(), {\n                  previousCalendarId: originalCalendarIdRef.current,\n                  nextCalendarId: editableCalendars[form.calendarIndex]?.id ?? null,\n                  previousCalendarLabel: stableCalInfo.name,\n                  nextCalendarLabel:\n                      editableCalendars[form.calendarIndex]?.name ?? stableCalInfo.name,\n              })\n            : [];\n'''
                  panel = replace_once(panel, scope_guard, scope_insert, 'scope changes calculation')
                  panel = replace_once(
                      panel,
                      '                    isTask={isTask}\n                    onCancel={cancelScopedEdit}\n',
                      '                    isTask={isTask}\n                    changes={scopeChanges}\n                    onCancel={cancelScopedEdit}\n',
                      'scope dialog changes prop',
                  )
                  write(panel_path, panel)

                  # Description becomes the final visual section; its input/event chain is untouched.
                  description_path = 'src/ui/calendar/DescriptionSection.tsx'
                  description = read(description_path)
                  description = replace_once(
                      description,
                      'className="nc-description-section"',
                      'className="nc-description-section nc-panel-section"',
                      'DescriptionSection class',
                  )
                  write(description_path, description)

                  # ── Pure, semantic recurring diff helper ──────────────────────
                  changes_path = root / 'src/ui/calendar/recurringEditChanges.ts'
                  if changes_path.exists():
                      raise RuntimeError('recurringEditChanges.ts already exists')
                  changes_path.write_text(r'''import { NeoEvent } from "../../types";
                  import {
                      eventToRecurrenceState,
                      recurrenceSummary,
                  } from "./recurrence";

                  export type RecurringEditChangeKey =
                      | "title"
                      | "date"
                      | "dates"
                      | "startTime"
                      | "endTime"
                      | "allDay"
                      | "repeat"
                      | "calendar"
                      | "status"
                      | "reminders"
                      | "description";

                  export interface RecurringEditChange {
                      key: RecurringEditChangeKey;
                      label: string;
                      before: string;
                      after: string;
                  }

                  export interface RecurringEditChangeContext {
                      previousCalendarId?: string | null;
                      nextCalendarId?: string | null;
                      previousCalendarLabel?: string;
                      nextCalendarLabel?: string;
                  }

                  function recordOf(event: NeoEvent): Record<string, unknown> {
                      return event as unknown as Record<string, unknown>;
                  }

                  function stringField(event: NeoEvent, key: string): string {
                      const value = recordOf(event)[key];
                      return typeof value === "string" ? value : "";
                  }

                  function startDateOf(event: NeoEvent): string {
                      const record = recordOf(event);
                      if (event.type === "recurring") {
                          return typeof record.startRecur === "string" ? record.startRecur : "";
                      }
                      if (event.type === "rrule") {
                          return typeof record.startDate === "string" ? record.startDate : "";
                      }
                      return typeof record.date === "string" ? record.date : "";
                  }

                  function endDateOf(event: NeoEvent): string {
                      if (event.type !== "single" && event.type !== undefined) return "";
                      return stringField(event, "endDate");
                  }

                  function shortText(value: string): string {
                      const compact = value.replace(/\s+/g, " ").trim();
                      if (!compact) return "Empty";
                      return compact.length > 72 ? `${compact.slice(0, 69)}…` : compact;
                  }

                  function dateText(start: string, end: string): string {
                      if (!start) return "None";
                      return end && end !== start ? `${start} – ${end}` : start;
                  }

                  function statusText(event: NeoEvent): string {
                      const record = recordOf(event);
                      if (!Object.prototype.hasOwnProperty.call(record, "completed")) return "Event";
                      if (record.completed === undefined || record.completed === null) return "Event";
                      return typeof record.completed === "string" && record.completed
                          ? "Done"
                          : "To do";
                  }

                  function remindersText(event: NeoEvent): string {
                      const value = recordOf(event).reminders;
                      if (value === undefined) return "Default";
                      if (!Array.isArray(value) || value.length === 0) return "None";
                      return value
                          .map((raw) => Number(raw))
                          .filter((value) => Number.isFinite(value))
                          .map((minutes) => {
                              if (minutes === 0) return "At start of event";
                              if (minutes % 1440 === 0) {
                                  const days = minutes / 1440;
                                  return `${days} day${days === 1 ? "" : "s"} before`;
                              }
                              if (minutes % 60 === 0) {
                                  const hours = minutes / 60;
                                  return `${hours} hour${hours === 1 ? "" : "s"} before`;
                              }
                              return `${minutes} min before`;
                          })
                          .join(", ");
                  }

                  function recurrenceState(event: NeoEvent) {
                      return eventToRecurrenceState(event, startDateOf(event));
                  }

                  function recurrenceKey(event: NeoEvent): string {
                      const state = recurrenceState(event);
                      return JSON.stringify({
                          isRecurring: state.isRecurring,
                          recurrence: state.recurrence,
                      });
                  }

                  function recurrenceText(event: NeoEvent): string {
                      const state = recurrenceState(event);
                      if (!state.isRecurring) return "Once";
                      return recurrenceSummary(state.recurrence, startDateOf(event));
                  }

                  export function recurringEditChanges(
                      stableEvent: NeoEvent,
                      payload: NeoEvent,
                      context: RecurringEditChangeContext = {},
                  ): RecurringEditChange[] {
                      const changes: RecurringEditChange[] = [];
                      const add = (
                          key: RecurringEditChangeKey,
                          label: string,
                          before: string,
                          after: string,
                      ) => {
                          if (before === after) return;
                          changes.push({ key, label, before, after });
                      };

                      add("title", "Title", shortText(stableEvent.title || ""), shortText(payload.title || ""));

                      const beforeStart = startDateOf(stableEvent);
                      const afterStart = startDateOf(payload);
                      const beforeEnd = endDateOf(stableEvent);
                      const afterEnd = endDateOf(payload);
                      add(
                          beforeEnd || afterEnd ? "dates" : "date",
                          beforeEnd || afterEnd ? "Dates" : "Date",
                          dateText(beforeStart, beforeEnd),
                          dateText(afterStart, afterEnd),
                      );

                      add(
                          "startTime",
                          "Start time",
                          stringField(stableEvent, "startTime") || "None",
                          stringField(payload, "startTime") || "None",
                      );
                      add(
                          "endTime",
                          "End time",
                          stringField(stableEvent, "endTime") || "None",
                          stringField(payload, "endTime") || "None",
                      );
                      add(
                          "allDay",
                          "All day",
                          stableEvent.allDay ? "On" : "Off",
                          payload.allDay ? "On" : "Off",
                      );

                      if (recurrenceKey(stableEvent) !== recurrenceKey(payload)) {
                          changes.push({
                              key: "repeat",
                              label: "Repeat",
                              before: recurrenceText(stableEvent),
                              after: recurrenceText(payload),
                          });
                      }

                      if (
                          context.previousCalendarId != null &&
                          context.nextCalendarId != null &&
                          context.previousCalendarId !== context.nextCalendarId
                      ) {
                          changes.push({
                              key: "calendar",
                              label: "Calendar",
                              before: context.previousCalendarLabel || context.previousCalendarId,
                              after: context.nextCalendarLabel || context.nextCalendarId,
                          });
                      }

                      add("status", "Status", statusText(stableEvent), statusText(payload));
                      add("reminders", "Reminders", remindersText(stableEvent), remindersText(payload));
                      add(
                          "description",
                          "Description",
                          shortText(stringField(stableEvent, "description")),
                          shortText(stringField(payload, "description")),
                      );

                      return changes;
                  }
                  ''', encoding='utf-8')

                  changes_test_path = root / 'src/ui/calendar/recurringEditChanges.test.ts'
                  changes_test_path.write_text(r'''import { NeoEvent } from "../../types";
                  import { recurringEditChanges } from "./recurringEditChanges";

                  const series = (extra: Record<string, unknown> = {}): NeoEvent =>
                      ({
                          title: "Standup",
                          allDay: false,
                          startTime: "08:00",
                          endTime: "08:30",
                          type: "rrule",
                          startDate: "2026-08-05",
                          rrule: "FREQ=WEEKLY;BYDAY=WE",
                          description: "Tour de table",
                          reminders: [10],
                          ...extra,
                      } as unknown as NeoEvent);

                  describe("recurringEditChanges", () => {
                      it("lists only fields that really changed", () => {
                          const changes = recurringEditChanges(
                              series(),
                              series({
                                  title: "Client demo",
                                  startTime: "09:00",
                                  description: "Demo and questions",
