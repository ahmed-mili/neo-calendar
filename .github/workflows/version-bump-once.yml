name: Version bump once

on:
    push:
        branches:
            - "fix/description-persistence"

permissions:
    contents: write

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Align every application version
              shell: bash
              run: |
                  current=$(node -p "require('./package.json').version")
                  if [ "$current" = "1.53.3" ]; then
                    echo "Version already aligned."
                    exit 0
                  fi

                  node scripts/set-version.mjs 1.53.3
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json \
                    apps/windows/package.json apps/windows/package-lock.json \
                    apps/windows/src-tauri/Cargo.toml apps/windows/src-tauri/Cargo.lock \
                    apps/windows/src-tauri/tauri.conf.json \
                    apps/android/package.json apps/android/package-lock.json \
                    apps/android/native/app/build.gradle.kts
                  git commit -m "Version 1.53.3"
                  git push
