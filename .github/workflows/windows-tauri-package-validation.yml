name: Windows Tauri package validation

on:
    pull_request:
        paths:
            - "apps/windows/src-tauri/icons/**"
            - "apps/windows/src-tauri/tauri.conf.json"
            - "scripts/windows-icon-format.test.mjs"
            - ".github/workflows/windows-tauri-package-validation.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    package:
        name: Build Windows installer
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/windows/package-lock.json

            - name: Réutiliser le cache Rust
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      apps/windows/src-tauri/target
                  key: cargo-${{ runner.os }}-icon-${{ github.run_id }}
                  restore-keys: cargo-${{ runner.os }}-

            - name: Installer les dépendances
              run: |
                  npm install --no-audit --no-fund
                  npm --prefix apps/windows install --ignore-scripts --no-audit --no-fund

            - name: Préparer la configuration updater
              run: node scripts/configure-tauri-updater.mjs

            # Reproduit le chemin exact qui a cassé la publication v1.73.4 :
            # `tauri::generate_context!()` doit décoder l'icône puis Tauri doit
            # aller jusqu'au bundle NSIS avec la même configuration de signature.
            - name: Construire et signer l'installateur
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: npm --prefix apps/windows run package
